name: Verify integrity

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check data integrity
        run: node scripts/verify-integrity.js
